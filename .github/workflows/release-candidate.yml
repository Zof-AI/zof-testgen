name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Prepare pinned GitHub release dependencies
        run: node scripts/bootstrap.mjs --allow-network
      - run: npm ci --ignore-scripts --prefer-offline
      - run: npm run check
      - run: npm pack --ignore-scripts
# This workflow builds only. Publication requires reviewed artifacts, a protected
# release environment, verified namespace and explicitly approved trusted publishing.
