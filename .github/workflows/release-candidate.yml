name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts
# This workflow builds only. Publication requires reviewed artifacts, a protected
# release environment, verified namespace and explicitly approved trusted publishing.
